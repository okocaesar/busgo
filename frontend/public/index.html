<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#0b7d45"
  />

  <meta
    name="description"
    content="BusGo Bus Ticket Reservation"
  />

  <link
    rel="manifest"
    href="%PUBLIC_URL%/manifest.json"
  />

  <title>BusGo</title>


  <style>
/* =========================================================
   BUSGO SPLASH — HARD LOCK
   This section intentionally uses !important everywhere
   needed to prevent external/global CSS from overriding it.
========================================================= */

html body #app-splash {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: 0 !important;

  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;

  margin: 0 !important;
  padding: 0 !important;

  overflow: hidden !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  background: #000000 !important;

  z-index: 2147483647 !important;

  opacity: 1 !important;
  visibility: visible !important;

  transform: none !important;
  animation: none !important;
  transition: none !important;

  clip-path: none !important;
  filter: none !important;

  pointer-events: auto !important;
}


/* =========================================================
   SPLASH IMAGE — ABSOLUTELY NO ANIMATION
========================================================= */

html body #app-splash img.splash-image {
  position: absolute !important;

  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: 0 !important;

  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;

  min-width: 100vw !important;
  min-height: 100vh !important;

  max-width: none !important;
  max-height: none !important;

  margin: 0 !important;
  padding: 0 !important;

  display: block !important;

  object-fit: cover !important;
  object-position: center center !important;

  opacity: 1 !important;

  visibility: visible !important;

  transform: none !important;

  animation: none !important;

  transition: none !important;

  clip-path: none !important;

  filter: none !important;

  -webkit-filter: none !important;

  scale: 1 !important;

  rotate: 0deg !important;

  translate: none !important;

  perspective: none !important;

  backface-visibility: visible !important;

  will-change: auto !important;

  contain: none !important;

  content-visibility: visible !important;

  object-view-box: none !important;

  border: 0 !important;
  outline: 0 !important;

  user-select: none !important;
  -webkit-user-select: none !important;

  -webkit-user-drag: none !important;

  pointer-events: none !important;

  z-index: 1 !important;
}


/* =========================================================
   DARK OVERLAY
========================================================= */

html body #app-splash div.splash-dark-overlay {
  position: absolute !important;

  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  left: 0 !important;

  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;

  margin: 0 !important;
  padding: 0 !important;

  display: block !important;

  background: rgba(0, 0, 0, 0.14) !important;

  opacity: 1 !important;

  visibility: visible !important;

  transform: none !important;

  animation: none !important;

  transition: none !important;

  clip-path: none !important;

  filter: none !important;

  pointer-events: none !important;

  z-index: 2 !important;
}


/* =========================================================
   LOADER
========================================================= */

html body #app-splash div.splash-loader {
  position: absolute !important;

  left: 50% !important;

  bottom: calc(
    8% + env(safe-area-inset-bottom)
  ) !important;

  width: auto !important;
  height: auto !important;

  margin: 0 !important;

  display: flex !important;

  align-items: center !important;
  justify-content: center !important;

  gap: 7px !important;

  padding: 8px 12px !important;

  border-radius: 30px !important;

  background: rgba(0, 0, 0, 0.25) !important;

  transform: translateX(-50%) !important;

  animation: none !important;

  transition: none !important;

  filter: none !important;

  clip-path: none !important;

  z-index: 3 !important;

  pointer-events: none !important;
}


/* =========================================================
   DOTS
   ONLY THE DOTS ARE ALLOWED TO ANIMATE.
========================================================= */

html body #app-splash div.splash-loader span.splash-dot {
  position: relative !important;

  width: 8px !important;
  height: 8px !important;

  min-width: 8px !important;
  min-height: 8px !important;

  max-width: 8px !important;
  max-height: 8px !important;

  margin: 0 !important;
  padding: 0 !important;

  display: block !important;

  border-radius: 50% !important;

  background: rgba(
    255,
    255,
    255,
    0.92
  ) !important;

  opacity: 0.35 !important;

  transform: translateY(0) scale(0.8) !important;

  animation:
    busgoSplashDotAnimation
    1s
    infinite
    ease-in-out !important;

  transition: none !important;

  filter: none !important;

  clip-path: none !important;

  z-index: 4 !important;
}


html body #app-splash
div.splash-loader
span.splash-dot:nth-child(1) {
  animation-delay: 0s !important;
}


html body #app-splash
div.splash-loader
span.splash-dot:nth-child(2) {
  animation-delay: 0.15s !important;
}


html body #app-splash
div.splash-loader
span.splash-dot:nth-child(3) {
  animation-delay: 0.30s !important;
}


/* =========================================================
   DOT ANIMATION
========================================================= */

@keyframes busgoSplashDotAnimation {

  0%,
  60%,
  100% {
    opacity: 0.35 !important;

    transform:
      translateY(0)
      scale(0.8) !important;
  }

  30% {
    opacity: 1 !important;

    transform:
      translateY(-4px)
      scale(1) !important;
  }
}


/* =========================================================
   HIDDEN STATE
========================================================= */

html body #app-splash.hidden {
  opacity: 0 !important;

  visibility: hidden !important;

  pointer-events: none !important;

  transform: none !important;

  animation: none !important;

  transition:
    opacity 0.25s ease !important;
}


/* =========================================================
   DESKTOP — COMPLETELY DISABLED
========================================================= */

@media (min-width: 769px) {

  html body #app-splash {
    display: none !important;

    visibility: hidden !important;

    opacity: 0 !important;

    pointer-events: none !important;
  }

}
</style>

</head>


<body>


  <!-- =========================================================
       BUSGO MOBILE SPLASH
  ========================================================= -->

  <div id="app-splash">


    <!-- =======================================================
         ACTUAL SPLASH ARTWORK

         IMPORTANT:
         This is splash.png.

         It is NOT the PWA installation icon.

         PWA icon:
         /icons/icon-192.png
         /icons/icon-512.png

         Splash artwork:
         /icons/splash.png
    ======================================================== -->

    <img
      src="%PUBLIC_URL%/icons/splash.png"
      alt=""
      class="splash-image"
      draggable="false"
    />


    <!-- =======================================================
         LIGHT DARK OVERLAY
    ======================================================== -->

    <div
      class="splash-dark-overlay"
      aria-hidden="true"
    ></div>


    <!-- =======================================================
         THREE DOT LOADER
    ======================================================== -->

    <div
      class="splash-loader"
      aria-label="Loading BusGo"
    >

      <span class="splash-dot"></span>

      <span class="splash-dot"></span>

      <span class="splash-dot"></span>

    </div>


  </div>


  <!-- =========================================================
       NO JAVASCRIPT MESSAGE
  ========================================================= -->

  <noscript>
    You need to enable JavaScript to run BusGo.
  </noscript>


  <!-- =========================================================
       REACT ROOT
  ========================================================= -->

  <div id="root"></div>


  <!-- =========================================================
       SPLASH CONTROL
  ========================================================= -->

  <script>

    (function () {

      const splash =
        document.getElementById(
          "app-splash"
        );

      const root =
        document.getElementById(
          "root"
        );


      if (!splash || !root) {
        return;
      }


      /* =======================================================
         MOBILE CHECK
      ======================================================= */

      const isMobile =
        window.matchMedia(
          "(max-width: 768px)"
        ).matches;


      /* =======================================================
         DESKTOP

         Completely remove splash.
      ======================================================= */

      if (!isMobile) {

        splash.remove();

        return;

      }


      /* =======================================================
         HIDE SPLASH
      ======================================================= */

      let splashHidden = false;


      const hideSplash = () => {

        if (splashHidden) {
          return;
        }

        splashHidden = true;


        splash.classList.add(
          "hidden"
        );


        /* Remove from DOM after fade */

        setTimeout(() => {

          if (
            splash &&
            splash.parentNode
          ) {

            splash.parentNode.removeChild(
              splash
            );

          }

        }, 300);

      };


      /* =======================================================
         CHECK REACT

         As soon as React renders the application,
         remove the splash.
      ======================================================= */

      const checkReactLoaded = () => {

        if (
          root &&
          root.children &&
          root.children.length > 0
        ) {

          hideSplash();

          return true;

        }

        return false;

      };


      /* =======================================================
         CHECK IMMEDIATELY
      ======================================================= */

      if (
        checkReactLoaded()
      ) {

        return;

      }


      /* =======================================================
         WATCH REACT ROOT
      ======================================================= */

      const observer =
        new MutationObserver(() => {

          if (
            checkReactLoaded()
          ) {

            observer.disconnect();

          }

        });


      observer.observe(
        root,
        {
          childList: true,
          subtree: true
        }
      );


      /* =======================================================
         SAFETY TIMEOUT

         The splash can NEVER remain forever.

         Maximum: 10 seconds.
      ======================================================= */

      setTimeout(() => {

        observer.disconnect();

        hideSplash();

      }, 10000);


    })();

  </script>


</body>

</html>
